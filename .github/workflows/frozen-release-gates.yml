name: Frozen release guard
on:
  push:
    paths: ['ops/**', '.github/workflows/frozen-release-gates.yml']
  pull_request:
    paths: ['ops/**', '.github/workflows/frozen-release-gates.yml']
jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify release gate cannot accept missing tests or stale source/assets
        run: |
          bash -n ops/production-overrides/peachy-start.sh
          python3 ops/production-overrides/tests/FrozenUploadReleaseGateTest.py
# The licensed Pro behavior suites run on the release host against the exact
# frozen candidate, not this repository's Lite package. CI does not waive them.
